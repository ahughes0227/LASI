name: CI

on:
  push:
  pull_request:

# A superseded run cannot report on the current commit; cancel it rather than
# paying for it.  Never cancel on the default branch, where every commit's
# result is part of the record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    # LASI's own tests run in seconds.  A job that exceeds this is hung, not
    # slow, and should fail fast instead of occupying a runner for six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The declared support floor and the version developed against.  A
        # single version would let breakage on either end land unnoticed.
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy services

      - name: Test
        run: python -m pytest

  # SQLite serialises writes and enforces nothing about concurrent row access, so the
  # behaviour that matters for a leased task graph -- FOR UPDATE SKIP LOCKED, real
  # foreign-key enforcement, JSON columns -- is only exercised against PostgreSQL.
  # Running the migration chain here is what keeps the two backends from diverging
  # silently between releases.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lasi
          POSTGRES_PASSWORD: lasi
          POSTGRES_DB: lasi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lasi -d lasi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      LASI_DATABASE_URL: postgresql+psycopg://lasi:lasi@localhost:5432/lasi
      LASI_TEST_DATABASE_URL: postgresql+psycopg://lasi:lasi@localhost:5432/lasi

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          # The optional extras are installed here rather than in the quality matrix:
          # they pull large dependency trees, and once per push is enough to keep the
          # tests that need them from silently skipping forever.
          python -m pip install -e ".[dev,postgres,dspy,sweeps]"

      - name: Run the full migration chain
        run: python -m alembic upgrade head

      - name: Downgrade and re-upgrade the newest revisions
        # A migration that cannot be reversed is a migration that cannot be recovered
        # from, and the reverse path is never exercised by a plain upgrade.
        run: |
          python -m alembic downgrade -3
          python -m alembic upgrade head

      - name: Test against PostgreSQL, with optional extras present
        run: python -m pytest
