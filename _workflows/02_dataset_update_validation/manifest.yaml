workflow_id: dataset_update_validation
goal: Validate whether a dataset update solved the intended problem and comparability
steps:
  - id: 01_review_update_proposal
    skill: dataset_characterization
  - id: 02_validate_parent_and_child_versions
    skill: dataset_characterization
  - id: 03_compare_characterizations
    skill: dataset_characterization
  - id: 04_plan_validation_experiments
    skill: experiment_planning
  - id: 05_decision_review
    skill: decision_review
    approval_required: true
  - id: 06_run_validation_experiments
    skill: remote_execution
    approval_required: true
  - id: 07_compare_results
    skill: experiment_planning
  - id: 08_update_dataset_portfolio
    skill: decision_review
  - id: 09_generate_update_report
    skill: report_generation
  - id: 10_record_outcome
    skill: outcome_recording
inputs:
  - parent_manifest
  - child_manifest
  - update_proposal
outputs:
  - decision_record
  - update_report
approval_points:
  - label_changes
  - dataset_promotion
  - benchmark_changes
  - remote_execution
