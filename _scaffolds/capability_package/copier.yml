# Fixed shell for a capability package.  The shell is structure only: every data file in the
# package is written from the frozen build plan by services.capabilitys.development, which
# remains the authority for what the package may contain.
_subdirectory: template

scaffold_template:
  type: str
  help: Supplied by services.scaffolds; do not set by hand

scaffold_revision:
  type: str
  help: Supplied by services.scaffolds; do not set by hand

package_title:
  type: str
  help: Heading for the package README

package_summary:
  type: str
  help: One-line description
  default: ""
