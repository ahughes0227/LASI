$schema: https://json-schema.org/draft/2020-12/schema
title: DecisionRecord
type: object
required:
  - decision_id
  - project_id
  - risk_level
  - decision
  - rationale
additionalProperties: false
properties:
  schema_version: {type: string, const: "1.0"}
  decision_id:
    type: string
  project_id:
    type: string
  recommendation_id:
    type: string
  experiment_plan_id:
    type: string
  experiment_plan_hash:
    type: ["null", string]
  action_requested:
    type: ["null", string]
  decision:
    type: string
    enum:
      - allow
      - allow_with_warning
      - block
      - escalate_for_approval
      - convert_to_proposal
      - request_clarification
      - stop_project
      - defer
  allowed: {type: boolean}
  decision_type:
    type: string
    enum: [operational, policy, budget, security, other]
  risk_level:
    type: string
    enum: [low, medium, high, critical]
  approved_by:
    type: ["null", string]
  approval_date:
    type: ["null", string]
    format: date
  approval_expiration:
    type: ["null", string]
    format: date
  blocked_by:
    type: array
    items: {type: string}
  missing_inputs:
    type: array
    items: {type: string}
  approval_required: {type: boolean}
  policy_checks: {type: object, additionalProperties: {type: [boolean, string]}}
  privacy_checks: {type: object, additionalProperties: {type: [boolean, string]}}
  budget_checks: {type: object, additionalProperties: {type: [boolean, string]}}
  remote_execution_checks: {type: object, additionalProperties: {type: [boolean, string]}}
  rationale:
    type: string
  conditions:
    type: array
    items: {type: string}
  next_action:
    type: ["null", string]
  handoff_target:
    type: ["null", string]
  created_at:
    type: ["null", string]
    format: date-time
  provenance:
    type: object
    additionalProperties: false
    properties:
      author:
        type: ["null", string]
      created_at:
        type: ["null", string]
        format: date-time
      source_path:
        type: ["null", string]
      source_records:
        type: array
        items: {type: string}
      source_artifacts:
        type: array
        items: {type: string}
