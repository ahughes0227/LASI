title: DatasetManifest
type: object
required:
  - project_id
  - dataset_version_id
  - file_list
properties:
  project_id: {type: string}
  dataset_version_id: {type: string}
  source_description: {type: string}
  file_list:
    type: array
    items:
      type: object
      properties:
        path: {type: string}
        checksum: {type: string}
  privacy_tags:
    type: array
    items: {type: string}
  owner_contact: {type: string}
  notes: {type: string}
  provenance:
    type: object
