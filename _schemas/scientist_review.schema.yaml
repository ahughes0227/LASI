title: ScientistReview
type: object
required: [review_id, project_id, provider_profile_id, model_name, prompt_template_version, diagnostic_packet_id, primary_diagnosis, diagnosis_confidence, recommended_next_action, expected_value]
additionalProperties: false
properties:
  schema_version: {type: string, const: "1.0"}
  review_id: {type: string}
  project_id: {type: string}
  experiment_ids:
    type: array
    items: {type: string}
  provider_profile_id: {type: string}
  model_name: {type: string}
  prompt_template_version: {type: string}
  diagnostic_packet_id: {type: string}
  primary_diagnosis: {type: string}
  diagnosis_confidence:
    type: number
    minimum: 0
    maximum: 1
  supporting_evidence:
    type: array
    items: {type: string}
  counter_evidence:
    type: array
    items: {type: string}
  alternative_hypotheses:
    type: array
    items: {type: object, additionalProperties: false}
  recommended_next_action: {type: string}
  expected_value: {type: string}
  estimated_cost: {type: object}
  stop_recommendation: {type: string}
  escalation_required: {type: boolean}
  human_review_required: {type: boolean}
  knowledge_references:
    type: array
    items: {type: string}
  evidence_references:
    type: array
    items: {type: string}
  uncertainty_notes:
    type: array
    items: {type: string}
  raw_response_artifact: {type: string}
  created_at: {type: ["null", string], format: date-time}
