capability_id: evaluation
name: Evaluation
version: 1.0.0
purpose: Inspect evaluation policy, metrics, comparisons, and evidence claims and record invalidations explicitly.
accepts:
  - experiment/result
  - policy/evaluation
  - artifact/metric
produces:
  - evaluation/report
  - evaluation/finding
  - evidence/invalidation
operations:
  - compare_metrics
  - check_evaluation_assumptions
  - record_invalidations
guarantees:
  - policy_is_applied
  - failures_are_recorded
  - claims_are_supported_by_evidence
constraints:
  - use_declared_metrics
  - preserve_comparison_context
side_effects: []
does_not:
  - rewrite_results
  - hide_failed_evaluations
execution_kind: opencode_skill
lifecycle: draft
provenance:
  source_path: system/capabilities/evaluation.md

