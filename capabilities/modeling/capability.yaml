capability_id: modeling
name: Modeling
version: 1.0.0
purpose: Run only approved experiment plans with declared inputs and isolated, traceable results.
accepts:
  - experiment/plan
  - experiment/input
  - decision/approval
produces:
  - experiment/result
  - model/artifact
  - run/log
operations:
  - execute_approved_plan
  - fit_declared_model
  - record_isolated_results
guarantees:
  - approval_is_required
  - runs_are_traceable
  - artifacts_are_linked_to_runs
constraints:
  - execute_declared_plan_only
  - use_isolated_workdir
side_effects: []
does_not:
  - execute_recommendations_directly
  - deploy_models
execution_kind: opencode_skill
lifecycle: draft
provenance:
  source_path: system/capabilities/modeling.md

