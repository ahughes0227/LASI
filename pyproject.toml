[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lasi"
version = "0.2.0"
description = "Governed, memory-informed ML research runtime"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45,<47",
    "graphiti-core>=0.29,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "litellm>=1.80,<2",
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
ignore_missing_imports = true
